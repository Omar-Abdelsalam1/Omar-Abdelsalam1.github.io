name: Sync publications from ORCID

on:
  schedule:
    - cron: "0 5 * * *"      # every day at 05:00 UTC
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-orcid.mjs
        env:
          ORCID_ID: "0009-0005-1609-1036"
      - name: Commit if changed
        run: |
          git config user.name "orcid-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add publications.json
          git diff --staged --quiet || (git commit -m "Update publications from ORCID" && git push)
